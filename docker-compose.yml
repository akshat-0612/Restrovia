services:
  db:
    image: postgres:16-alpine
    container_name: restrovia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: restrovia
      POSTGRES_PASSWORD: restrovia
      POSTGRES_DB: restrovia
    ports:
      - "5544:5432"
    volumes:
      - restrovia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restrovia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  restrovia_pgdata:

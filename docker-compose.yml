services:
  db:
    image: postgres:16-alpine
    container_name: delightful-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: delightful
      POSTGRES_PASSWORD: delightful
      POSTGRES_DB: delightful
    ports:
      - "5544:5432"
    volumes:
      - delightful_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delightful"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  delightful_pgdata:
